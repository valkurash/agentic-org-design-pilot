  - "[x] Detectors on JSON/policy — not HTTP mounts?"
  - "[x] Confound checklist from task_01 embedded?"
  - "[x] E2 topic filter escalation-specific (no bare amount|finance)?"
  - "[x] Seed claims for E2/E5 so traps are not coder-dependent inactive?"
  - "[x] E1 without bare 500?"
  - "[x] E4 manager-self-approve limitation documented?"
  - "[x] Stand --task wiring + detector implementations?"
  - "[x] E2/E5 inactive (undecided ≠ pass)?"
  - "[ ] Pilot bite ≥3 pairs Condition A?"
